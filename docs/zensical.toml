[project]
site_url = "https://ocha-dap.github.io/topo-tools-py/"
site_name = "Topo Tools"
repo_url = "https://github.com/OCHA-DAP/topo-tools-py"
repo_name = "OCHA-DAP/topo-tools-py"
edit_uri = "edit/main/docs/pages/"

docs_dir = "pages"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "1. Schema" = [
    "1-schema/index.md",
    { "Tutorial" = "1-schema/tutorial.md" },
    { "How-to" = "1-schema/how-to.md" },
    { "Reference" = [
      "1-schema/reference/schema_map.md",
      "1-schema/reference/schema_join.md",
      "1-schema/reference/schema_fill.md",
    ] },
    { "Explanation" = [
      { "Overview" = "1-schema/explanation/overview.md" },
      "1-schema/explanation/schema_map.md",
      "1-schema/explanation/schema_join.md",
      "1-schema/explanation/schema_fill.md",
    ] },
  ] },
  { "2. Topology" = [
    "2-topology/index.md",
    { "Tutorial" = "2-topology/tutorial.md" },
    { "How-to" = "2-topology/how-to.md" },
    { "Reference" = [
      "2-topology/reference/topo_detect.md",
      "2-topology/reference/topo_clean.md",
    ] },
    { "Explanation" = [
      { "Overview" = "2-topology/explanation/overview.md" },
      "2-topology/explanation/topo_detect.md",
      "2-topology/explanation/topo_clean.md",
    ] },
  ] },
  { "3. Edge matching" = [
    "3-edge/index.md",
    { "Tutorial" = "3-edge/tutorial.md" },
    { "How-to" = "3-edge/how-to.md" },
    { "Reference" = [
      "3-edge/reference/edge_extend.md",
      "3-edge/reference/edge_clip.md",
      "3-edge/reference/edge_stitch.md",
      "3-edge/reference/edge_match.md",
      "3-edge/reference/edge_mosaic.md",
    ] },
    { "Explanation" = [
      { "Overview" = "3-edge/explanation/overview.md" },
      "3-edge/explanation/assign.md",
      "3-edge/explanation/edge_extend.md",
      "3-edge/explanation/edge_clip.md",
      "3-edge/explanation/edge_stitch.md",
      "3-edge/explanation/edge_match.md",
      "3-edge/explanation/edge_mosaic.md",
      "3-edge/explanation/voronoi-memory.md",
    ] },
  ] },
  { "4. Codes" = [
    "4-codes/index.md",
    { "Tutorial" = "4-codes/tutorial.md" },
    { "change tutorial" = "4-codes/change-tutorial.md" },
    { "How-to" = "4-codes/how-to.md" },
    { "Reference" = [
      "4-codes/reference/code_refactor.md",
      "4-codes/reference/code_update.md",
      "4-codes/reference/change.md",
    ] },
    { "Explanation" = [
      { "Overview" = "4-codes/explanation/overview.md" },
      "4-codes/explanation/code.md",
      "4-codes/explanation/code_refactor.md",
      "4-codes/explanation/code_update.md",
      "4-codes/explanation/change.md",
    ] },
  ] },
  { "5. Names" = [
    "5-names/index.md",
  ] },
  { "6. Packaging" = [
    "6-packaging/index.md",
    { "Tutorial" = "6-packaging/tutorial.md" },
    { "How-to" = "6-packaging/how-to.md" },
    { "Reference" = [
      "6-packaging/reference/package.md",
      "6-packaging/reference/package_polygons.md",
      "6-packaging/reference/package_points.md",
      "6-packaging/reference/package_lines.md",
    ] },
    { "Explanation" = [
      { "Overview" = "6-packaging/explanation/overview.md" },
      "6-packaging/explanation/package.md",
      "6-packaging/explanation/package_polygons.md",
      "6-packaging/explanation/package_points.md",
      "6-packaging/explanation/package_lines.md",
    ] },
  ] },
  { "Agents" = [
    "agents/index.md",
    "agents/claude-code.md",
    "agents/other-agents.md",
  ] },
  { "Web app" = "https://ocha-dap.github.io/topo-tools-js/" },
]

[project.extra]
generator = false

[project.extra.status]
draft = "Draft, not yet reviewed"

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
sane_lists = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.options.custom_icons = ["icons"]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
