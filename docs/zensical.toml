[project]
site_url = "https://ocha-dap.github.io/topo-tools-py/"
site_name = "Topo Tools"
repo_url = "https://github.com/OCHA-DAP/topo-tools-py"
repo_name = "OCHA-DAP/topo-tools-py"
edit_uri = "edit/main/docs/pages/"

docs_dir = "pages"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Tutorials" = [
    "tutorials/index.md",
    "tutorials/change.md",
    "tutorials/code.md",
    "tutorials/edge.md",
    "tutorials/package.md",
    "tutorials/schema.md",
    "tutorials/topo.md",
  ] },
  { "How-to" = [
    "how-to/index.md",
    { "COD-AB cleaning" = [
      "how-to/cod-ab/01-schema.md",
      "how-to/cod-ab/02-topology.md",
      "how-to/cod-ab/03-edge-matching.md",
      "how-to/cod-ab/04-codes.md",
      "how-to/cod-ab/05-names.md",
      "how-to/cod-ab/06-packaging.md",
    ] },
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/change.md",
    { "Code" = [
      "reference/code_refactor.md",
      "reference/code_update.md",
    ] },
    { "Edge" = [
      "reference/edge_clip.md",
      "reference/edge_extend.md",
      "reference/edge_match.md",
      "reference/edge_mosaic.md",
      "reference/edge_stitch.md",
    ] },
    { "Package" = [
      "reference/package.md",
      "reference/package_lines.md",
      "reference/package_points.md",
      "reference/package_polygons.md",
    ] },
    { "Schema" = [
      "reference/schema_crosswalk.md",
      "reference/schema_fill.md",
      "reference/schema_join.md",
      "reference/schema_map.md",
      "reference/schema_refactor.md",
    ] },
    "reference/shared.md",
    { "Topo" = [
      "reference/topo_clean.md",
      "reference/topo_detect.md",
    ] },
  ] },
  { "Explanation" = [
    "explanation/index.md",
    "explanation/assign.md",
    "explanation/change.md",
    { "Code" = [
      "explanation/code_overview.md",
      "explanation/code.md",
      "explanation/code_refactor.md",
      "explanation/code_update.md",
    ] },
    { "Edge" = [
      "explanation/edge_overview.md",
      "explanation/edge_clip.md",
      "explanation/edge_extend.md",
      "explanation/edge_match.md",
      "explanation/edge_mosaic.md",
      "explanation/edge_stitch.md",
    ] },
    { "Package" = [
      "explanation/package_overview.md",
      "explanation/package.md",
      "explanation/package_lines.md",
      "explanation/package_points.md",
      "explanation/package_polygons.md",
    ] },
    "explanation/performance.md",
    { "Schema" = [
      "explanation/schema_overview.md",
      "explanation/schema_crosswalk.md",
      "explanation/schema_fill.md",
      "explanation/schema_join.md",
      "explanation/schema_map.md",
      "explanation/schema_refactor.md",
    ] },
    { "Topo" = [
      "explanation/topo_overview.md",
      "explanation/topo_clean.md",
      "explanation/topo_detect.md",
    ] },
    "explanation/topology.md",
    "explanation/voronoi-memory.md",
  ] },
  { "Agents" = [
    "agents/index.md",
    "agents/claude-code.md",
    "agents/other-agents.md",
  ] },
]

[project.extra.status]
draft = "Draft, not yet reviewed"

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
sane_lists = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
