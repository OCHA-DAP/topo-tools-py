name: Notify docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger topo-tools-docs submodule bump
        env:
          TOKEN: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/OCHA-DAP/topo-tools-docs/dispatches \
            -d '{"event_type":"docs-updated","client_payload":{"submodule":"topo-tools-py"}}'
